</head>
<body spellcheck="false">
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-inner">
        <span class="logo-mark" id="logoSidebar" role="img" aria-label="Logo Pamulang Printing"></span>
        <div>
          <div class="sidebar-title">Pamulang<span>Printing</span></div>
          <div class="sidebar-caption">Digital Printing Solution</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="document.getElementById('loadFileInput').click()">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </span>
        Muat Invoice
      </button>
      <input type="file" id="loadFileInput" accept=".json" style="display:none" onchange="handleLoadFile(event)">

      <button class="btn btn-secondary" onclick="saveInvoice()">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </span>
        Simpan
      </button>

      <button class="btn btn-secondary" onclick="toggleLunas()">
        <span class="btn-icon icon-red">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </span>
        Tandai Lunas
      </button>

      <!-- ENHANCED: Download PDF button -->
      <button class="btn btn-secondary" onclick="printInvoice()" id="btnPrint">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </span>
        Cetak Dokumen
      </button>

      <button class="btn btn-secondary" onclick="downloadInvoicePDF()" id="btnDownloadPDF">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </span>
        Unduh PDF
      </button>

      <!-- ENHANCED: WhatsApp button with file attachment -->
      <button class="btn btn-secondary" onclick="sendWhatsApp()" id="btnWhatsApp">

        </span>
        Kirim WhatsApp
      </button>

      <button class="btn btn-secondary" onclick="openHistory()">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        Riwayat Invoice
      </button>

      <button class="btn btn-secondary" onclick="openGallery()">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </span>
        Katalog Produk
      </button>

      <button class="btn btn-secondary" onclick="openReport()">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </span>
        Laporan Bulanan
      </button>

      <button class="btn btn-secondary" onclick="openBackup()">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>
        </span>
        Backup &amp; Restore
      </button>

      <button class="btn btn-outline-red" onclick="newInvoice()">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </span>
        Invoice Baru
      </button>

      <!-- Pengaturan sengaja diletakkan paling bawah: jarang dibuka
           setelah setup awal, jadi tidak mengganggu menu harian. -->
      <button class="btn btn-secondary btn-settings" onclick="openSettings()">
        <span class="btn-icon">
